<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Anniversary!</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #050510;
            color: white;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        /* --- Background Bintang --- */
        .stars {
            position: absolute;
            width: 100%;
            height: 100%;
            z-index: -2;
            background: transparent;
        }
        
        .star {
            position: absolute;
            background-color: white;
            border-radius: 50%;
            animation: twinkle infinite ease-in-out;
        }

        @keyframes twinkle {
            0%, 100% { opacity: 0.2; transform: scale(0.8); }
            50% { opacity: 1; transform: scale(1.2); }
        }

        /* --- Background Partikel Love --- */
        .hearts-container {
            position: absolute;
            width: 100%;
            height: 100%;
            z-index: -1;
            overflow: hidden;
        }

        .heart {
            position: absolute;
            color: rgba(255, 77, 77, 0.6);
            font-size: 1.5rem;
            animation: floatUp linear infinite;
            bottom: -50px;
        }

        @keyframes floatUp {
            0% { transform: translateY(0) scale(0.5) rotate(0deg); opacity: 0; }
            20% { opacity: 1; }
            100% { transform: translateY(-110vh) scale(1.5) rotate(360deg); opacity: 0; }
        }

        /* --- Container Utama --- */
        .screen {
            display: none; 
            flex-direction: column;
            align-items: center;
            text-align: center;
            animation: fadeIn 1s ease-in;
            width: 90%;
            max-width: 400px;
            z-index: 10;
        }

        .screen.active {
            display: flex;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* --- Layar Login --- */
        .pin-box {
            background: rgba(255, 255, 255, 0.1);
            padding: 30px;
            border-radius: 15px;
            backdrop-filter: blur(5px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .pin-box h2 {
            margin-bottom: 20px;
            font-size: 1.2rem;
            letter-spacing: 1px;
        }

        .pin-input {
            width: 150px;
            padding: 10px;
            font-size: 2rem;
            text-align: center;
            letter-spacing: 10px;
            border: none;
            border-bottom: 2px solid white;
            background: transparent;
            color: white;
            outline: none;
            margin-bottom: 20px;
        }

        .btn {
            background: white;
            color: #050510;
            padding: 10px 25px;
            border: none;
            border-radius: 25px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        .btn:hover {
            background: #ff4d4d;
            color: white;
            transform: scale(1.05);
        }

        /* --- Layar Galeri Foto --- */
        .polaroid {
            background: white;
            padding: 15px 15px 25px 15px;
            border-radius: 5px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.5);
            margin-bottom: 25px;
            width: 100%;
        }

        .polaroid img {
            width: 100%;
            height: 320px;
            object-fit: cover;
            border-radius: 3px;
            background-color: #eee;
        }

        .polaroid p {
            color: #333;
            margin-top: 15px;
            font-size: 1.1rem;
            font-style: italic;
        }

        /* --- Layar Animasi Jarak --- */
        .distance-card {
            background: rgba(255, 255, 255, 0.1);
            padding: 25px 20px;
            border-radius: 15px;
            backdrop-filter: blur(5px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            width: 100%;
            margin-bottom: 20px;
        }

        .distance-card h2 {
            font-size: 1.3rem;
            margin-bottom: 20px;
        }

        .location-box {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
            position: relative;
        }

        .city {
            font-size: 0.9rem;
            font-weight: bold;
        }

        .city-icon {
            font-size: 1.8rem;
            margin-bottom: 5px;
        }

        .line-wrapper {
            flex-grow: 1;
            margin: 0 15px;
            position: relative;
            height: 2px;
            background: rgba(255, 255, 255, 0.3);
        }

        .moving-heart {
            position: absolute;
            top: -12px;
            left: 0%;
            font-size: 1.2rem;
            animation: moveHeart 3s ease-in-out infinite alternate;
        }

        @keyframes moveHeart {
            0% { left: 0%; }
            100% { left: 85%; }
        }

        .distance-count {
            font-size: 2.2rem;
            font-weight: bold;
            color: #ff4d4d;
            margin: 15px 0 10px 0;
            text-shadow: 0 0 10px rgba(255, 77, 77, 0.4);
        }

        .distance-quote {
            font-size: 0.95rem;
            line-height: 1.4;
            opacity: 0.9;
        }

        /* --- Layar Akhir --- */
        .rocket {
            font-size: 5rem;
            margin-bottom: 20px;
            animation: flyUp 2s ease-in-out infinite alternate;
        }

        @keyframes flyUp {
            from { transform: translateY(0); }
            to { transform: translateY(-30px); }
        }

        .final-text {
            font-size: 1.8rem;
            color: #ff4d4d;
            text-shadow: 0 0 10px rgba(255, 77, 77, 0.5);
            line-height: 1.4;
        }

    </style>
</head>
<body>

    <div class="stars" id="stars-container"></div>
    <div class="hearts-container" id="hearts-container"></div>

    <!-- Layar 1: PIN -->
    <div id="screen-login" class="screen active">
        <div class="pin-box">
            <h2>Masukkan Kode Rahasia Kita</h2>
            <input type="text" id="pin-input" class="pin-input" maxlength="4" placeholder="••••">
            <br>
            <button class="btn" onclick="checkPin()">Buka</button>
            <p id="error-msg" style="color: #ff4d4d; margin-top: 10px; font-size: 0.9rem; display: none;">Kodenya salah sayang, coba inget lagi!</p>
        </div>
    </div>

    <!-- Layar 2: Galeri Foto -->
    <div id="screen-gallery" class="screen">
        <div class="polaroid">
            <img id="gallery-img" src="" alt="Foto Kita">
            <p id="gallery-text"></p>
        </div>
        <button class="btn" onclick="nextPhoto()">Next ➔</button>
    </div>

    <!-- Layar 3: Animasi Jarak -->
    <div id="screen-distance" class="screen">
        <div class="distance-card">
            <h2>Jarak Bukan Penghalang ❤️</h2>
            
            <div class="location-box">
                <div>
                    <div class="city-icon">📍</div>
                    <div class="city" id="nama-kota-kamu">KOTA KAMU</div>
                </div>

                <div class="line-wrapper">
                    <div class="moving-heart">💖</div>
                </div>

                <div>
                    <div class="city-icon">📍</div>
                    <div class="city" id="nama-kota-dia">KOTA DIA</div>
                </div>
            </div>

            <div class="distance-count" id="distance-number">0 KM</div>
            <p class="distance-quote" id="pesan-jarak">UBAH PESAN JARAK INI</p>
        </div>
        <button class="btn" onclick="goToFinal()">Lanjut Ke Ucapan 🚀</button>
    </div>

    <!-- Layar 4: Akhir -->
    <div id="screen-final" class="screen">
        <div class="rocket">🚀</div>
        <h1 class="final-text">Happy Anniversary<br>13 Agustus! ❤️</h1>
    </div>

    <script>
        // ==========================================
        // BAGIAN YANG HARUS LU EDIT BRE
        // ==========================================
        
        // 1. PIN TANGGAL LAHIR
        const KODE_PIN = "0111";

        // 2. DATA JARAK DAN LOKASI
        const KOTA_KAMU = "Nunukan";          // Ganti nama kota/lokasi lu
        const KOTA_DIA = "Jember";           // Ganti nama kota/lokasi cewek lu
        const JARAK_KM = 2.294                  // Masukkan angka jaraknya dalam KM (hanya angka)
        const PESAN_JARAK = "Sejauh apapun jarak kita, hati aku bakalan selalu ada di sebelah kamu. Happy 1st Anniversary sayang!";

        // 3. GALERI 5 FOTO
        const galeri = [
            {
                gambar: "LINK FOTO 1 TARO SINI.jpg", 
                teks: "Ini foto kita pas pertama kali naik gunung bareng 😭, Kamu masi inget kan HAHAHAH :)"
            },
            {
                gambar: "LINK FOTO 2 TARO SINI.jpg", 
                teks: "Ini juga foto pas kamu maksa aku main ff 😭, padahal aku gengsi aja kalo bukan karna kamu aku gabakalan maen 🥰"
            },
            {
                gambar: "LINK FOTO 3 TARO SINI.jpg", 
                teks: "Ini salah satu foto yang bikin aku naksir kamu, dari awal liat ini itu, kamu keliatan cantik banget aku suka idung kamu, rambut, semuanya deh hehee. kamu cantik sekali sayaang ♡´･ᴗ･`♡"
            },
            {
                gambar: "LINK FOTO 4 TARO SINI.jpg", 
                teks: "Serius kamu dulu suka sama aku 😭, padahal aku ga pd tau, liat aja deh bocah ingusan ini dapet cewe nya se cantik bidadari :)"
            },
            {
                gambar: "LINK FOTO 5 TARO SINI.jpg", 
                teks: "Tapi mau bagaimana pun aku tetap pemenang di hati kamu, Terimakasih yaaa sayaang ku yang cantikkk gemes lucuuuuuu imuttttt, AKU SAYAANG KAMUUUU🤍🥰"
            }
        ];

        // ==========================================
        // LOGIKA PROGRAM
        // ==========================================
        
        let currentPhotoIndex = 0;

        function createStars() {
            const starsContainer = document.getElementById('stars-container');
            for (let i = 0; i < 100; i++) {
                const star = document.createElement('div');
                star.className = 'star';
                star.style.width = Math.random() * 3 + 'px';
                star.style.height = star.style.width;
                star.style.left = Math.random() * 100 + '%';
                star.style.top = Math.random() * 100 + '%';
                star.style.animationDuration = (Math.random() * 3 + 2) + 's';
                starsContainer.appendChild(star);
            }
        }

        function createHearts() {
            const heartsContainer = document.getElementById('hearts-container');
            for (let i = 0; i < 20; i++) {
                const heart = document.createElement('div');
                heart.className = 'heart';
                heart.innerHTML = '❤';
                heart.style.left = Math.random() * 100 + '%';
                heart.style.animationDuration = (Math.random() * 5 + 5) + 's';
                heart.style.animationDelay = (Math.random() * 5) + 's';
                heart.style.fontSize = (Math.random() * 15 + 10) + 'px';
                heartsContainer.appendChild(heart);
            }
        }

        createStars();
        createHearts();

        function checkPin() {
            const input = document.getElementById('pin-input').value;
            if (input === KODE_PIN) {
                document.getElementById('screen-login').classList.remove('active');
                tampilkanFoto();
                document.getElementById('screen-gallery').classList.add('active');
            } else {
                document.getElementById('error-msg').style.display = 'block';
            }
        }

        function tampilkanFoto() {
            document.getElementById('gallery-img').src = galeri[currentPhotoIndex].gambar;
            document.getElementById('gallery-text').innerText = galeri[currentPhotoIndex].teks;
        }

        function nextPhoto() {
            currentPhotoIndex++;
            if (currentPhotoIndex < galeri.length) {
                const galleryScreen = document.getElementById('screen-gallery');
                galleryScreen.style.animation = 'none';
                galleryScreen.offsetHeight; 
                galleryScreen.style.animation = null; 
                tampilkanFoto();
            } else {
                // Selesai foto, pindah ke layar jarak
                document.getElementById('screen-gallery').classList.remove('active');
                tampilkanLayarJarak();
                document.getElementById('screen-distance').classList.add('active');
            }
        }

        function tampilkanLayarJarak() {
            document.getElementById('nama-kota-kamu').innerText = KOTA_KAMU;
            document.getElementById('nama-kota-dia').innerText = KOTA_DIA;
            document.getElementById('pesan-jarak').innerText = PESAN_JARAK;

            // Animasi Angka Jarak Berjalan (Count Up)
            let start = 0;
            const duration = 2000; // 2 detik
            const counterElement = document.getElementById('distance-number');
            const stepTime = Math.abs(Math.floor(duration / JARAK_KM));
            
            const timer = setInterval(() => {
                start += Math.ceil(JARAK_KM / 50);
                if (start >= JARAK_KM) {
                    start = JARAK_KM;
                    clearInterval(timer);
                }
                counterElement.innerText = start + " KM";
            }, 30);
        }

        function goToFinal() {
            document.getElementById('screen-distance').classList.remove('active');
            document.getElementById('screen-final').classList.add('active');
        }
    </script>
</body>
</html>
