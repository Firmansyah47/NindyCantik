<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Anniversary!</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #050510;
            color: white;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        /* --- Animasi Bintang --- */
        .stars {
            position: absolute;
            width: 100%;
            height: 100%;
            z-index: -2;
            background: transparent;
        }
        
        .star {
            position: absolute;
            background-color: white;
            border-radius: 50%;
            animation: twinkle infinite ease-in-out;
        }

        @keyframes twinkle {
            0%, 100% { opacity: 0.2; transform: scale(0.8); }
            50% { opacity: 1; transform: scale(1.2); }
        }

        /* --- Animasi Partikel Love --- */
        .hearts-container {
            position: absolute;
            width: 100%;
            height: 100%;
            z-index: -1;
            overflow: hidden;
        }

        .heart {
            position: absolute;
            color: rgba(255, 77, 77, 0.6); /* Warna merah soft */
            font-size: 1.5rem;
            animation: floatUp linear infinite;
            bottom: -50px;
        }

        @keyframes floatUp {
            0% { 
                transform: translateY(0) scale(0.5) rotate(0deg); 
                opacity: 0; 
            }
            20% {
                opacity: 1;
            }
            100% { 
                transform: translateY(-110vh) scale(1.5) rotate(360deg); 
                opacity: 0; 
            }
        }

        /* --- Container Utama --- */
        .screen {
            display: none; 
            flex-direction: column;
            align-items: center;
            text-align: center;
            animation: fadeIn 1s ease-in;
            width: 90%;
            max-width: 400px;
            z-index: 10;
        }

        .screen.active {
            display: flex;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* --- Tampilan Layar Login (PIN) --- */
        .pin-box {
            background: rgba(255, 255, 255, 0.1);
            padding: 30px;
            border-radius: 15px;
            backdrop-filter: blur(5px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .pin-box h2 {
            margin-bottom: 20px;
            font-size: 1.2rem;
            letter-spacing: 1px;
        }

        .pin-input {
            width: 150px;
            padding: 10px;
            font-size: 2rem;
            text-align: center;
            letter-spacing: 10px;
            border: none;
            border-bottom: 2px solid white;
            background: transparent;
            color: white;
            outline: none;
            margin-bottom: 20px;
        }

        .btn {
            background: white;
            color: #050510;
            padding: 10px 25px;
            border: none;
            border-radius: 25px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        .btn:hover {
            background: #ff4d4d;
            color: white;
            transform: scale(1.05);
        }

        /* --- Tampilan Galeri Foto (Polaroid) --- */
        .polaroid {
            background: white;
            padding: 15px 15px 25px 15px;
            border-radius: 5px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.5);
            margin-bottom: 25px;
            width: 100%;
        }

        .polaroid img {
            width: 100%;
            height: 350px;
            object-fit: cover;
            border-radius: 3px;
            background-color: #eee; /* Kalo foto belum ada, warnanya abu-abu */
        }

        .polaroid p {
            color: #333;
            margin-top: 15px;
            font-size: 1.1rem;
            font-style: italic;
        }

        /* --- Tampilan Akhir (Roket & Teks) --- */
        .rocket {
            font-size: 5rem;
            margin-bottom: 20px;
            animation: flyUp 2s ease-in-out infinite alternate;
        }

        @keyframes flyUp {
            from { transform: translateY(0); }
            to { transform: translateY(-30px); }
        }

        .final-text {
            font-size: 1.8rem;
            color: #ff4d4d;
            text-shadow: 0 0 10px rgba(255, 77, 77, 0.5);
            line-height: 1.4;
        }

    </style>
</head>
<body>

    <!-- Latar Belakang Bintang & Love -->
    <div class="stars" id="stars-container"></div>
    <div class="hearts-container" id="hearts-container"></div>

    <!-- Layar 1: Masukkan PIN -->
    <div id="screen-login" class="screen active">
        <div class="pin-box">
            <h2>Masukkan Kode Rahasia Kita</h2>
            <input type="text" id="pin-input" class="pin-input" maxlength="4" placeholder="••••">
            <br>
            <button class="btn" onclick="checkPin()">Buka</button>
            <p id="error-msg" style="color: #ff4d4d; margin-top: 10px; font-size: 0.9rem; display: none;">Kodenya salah sayang, coba inget lagi!</p>
        </div>
    </div>

    <!-- Layar 2: Galeri Foto -->
    <div id="screen-gallery" class="screen">
        <div class="polaroid">
            <img id="gallery-img" src="" alt="Foto Kita">
            <p id="gallery-text"></p>
        </div>
        <button class="btn" onclick="nextPhoto()">Next ➔</button>
    </div>

    <!-- Layar 3: Akhir (Roket & Ucapan) -->
    <div id="screen-final" class="screen">
        <div class="rocket">🚀</div>
        <h1 class="final-text">Happy Anniversary<br>13 Agustus! ❤️</h1>
    </div>

    <script>
        // ==========================================
        // BAGIAN YANG HARUS LU EDIT BRE
        // ==========================================
        
        // 1. PIN TANGGAL LAHIR (Bebas ubah 4 digit angkanya)
        const KODE_PIN = "0111";

        // 2. GALERI 5 FOTO (Ubah bagian gambar dan teksnya)
        // Lu bisa masukin nama file (misal: "foto1.jpg") ATAU link URL langsung.
        const galeri = [
            {
                gambar: "LINK FOTO 1 TARO SINI.jpg", 
                teks: "Masi inget ga Kita ketemuan di Lumber tycoon sumpah ga nyangka banget😭"
            },
            {
                gambar: "LINK FOTO 2 TARO SINI.jpg", 
                teks: "Ini jarak aku dan kamu jauh banget ya, tapi kita bisa bertahan buktinyaa🥰"
            },
            {
                gambar: "LINK FOTO 3 TARO SINI.jpg", 
                teks: "Ini foto pertama yang kamu kirim, paling akuu sukaaa sampe sekarang ><"
            },
            {
                gambar: "LINK FOTO 4 TARO SINI.jpg", 
                teks: "Ini pas kita naik gunung Hahahaha, ga nyangka ya udah setahun aja kenangan ini :)"
            },
            {
                gambar: "LINK FOTO 5 TARO SINI.jpg", 
                teks: "Sayaang aku berterimakasih sama kamu, kalo aku ga ketemu kamu ga mungkin aku bisa sampe sejauh ini, aku dulu itu pemalas banget,Terimakasih udah sama aku :)"
            }
        ];

        // ==========================================
        // LOGIKA PROGRAM (Biarin aja gak usah diedit)
        // ==========================================
        
        let currentPhotoIndex = 0;

        // Fungsi Bikin Bintang
        function createStars() {
            const starsContainer = document.getElementById('stars-container');
            for (let i = 0; i < 100; i++) {
                const star = document.createElement('div');
                star.className = 'star';
                star.style.width = Math.random() * 3 + 'px';
                star.style.height = star.style.width;
                star.style.left = Math.random() * 100 + '%';
                star.style.top = Math.random() * 100 + '%';
                star.style.animationDuration = (Math.random() * 3 + 2) + 's';
                starsContainer.appendChild(star);
            }
        }

        // Fungsi Bikin Partikel Love Melayang
        function createHearts() {
            const heartsContainer = document.getElementById('hearts-container');
            for (let i = 0; i < 20; i++) {
                const heart = document.createElement('div');
                heart.className = 'heart';
                heart.innerHTML = '❤';
                heart.style.left = Math.random() * 100 + '%';
                heart.style.animationDuration = (Math.random() * 5 + 5) + 's'; // Kecepatan melayang 5-10 detik
                heart.style.animationDelay = (Math.random() * 5) + 's'; // Jeda muncul biar gak barengan
                heart.style.fontSize = (Math.random() * 15 + 10) + 'px'; // Ukuran love beda-beda
                heartsContainer.appendChild(heart);
            }
        }

        createStars();
        createHearts();

        // Fungsi Cek PIN
        function checkPin() {
            const input = document.getElementById('pin-input').value;
            if (input === KODE_PIN) {
                document.getElementById('screen-login').classList.remove('active');
                tampilkanFoto();
                document.getElementById('screen-gallery').classList.add('active');
            } else {
                document.getElementById('error-msg').style.display = 'block';
            }
        }

        // Fungsi Tampilkan Foto
        function tampilkanFoto() {
            document.getElementById('gallery-img').src = galeri[currentPhotoIndex].gambar;
            document.getElementById('gallery-text').innerText = galeri[currentPhotoIndex].teks;
        }

        // Fungsi Tombol Next
        function nextPhoto() {
            currentPhotoIndex++;
            
            if (currentPhotoIndex < galeri.length) {
                // Efek animasi simpel pas ganti foto
                const galleryScreen = document.getElementById('screen-gallery');
                galleryScreen.style.animation = 'none';
                galleryScreen.offsetHeight; 
                galleryScreen.style.animation = null; 
                
                tampilkanFoto();
            } else {
                // Kalo foto abis (foto ke-5 udah dilewatin), munculin roket
                document.getElementById('screen-gallery').classList.remove('active');
                document.getElementById('screen-final').classList.add('active');
            }
        }
    </script>
</body>
</html>
